name: Validate and build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test native Windows Bluetooth API
        shell: pwsh
        run: |
          npm run test:bluetooth 2>&1 | Tee-Object -FilePath bluetooth-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Get-Content bluetooth-test.log -Tail 25 | ForEach-Object { Write-Output "::error::$_" }
            exit $testExit
          }
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Build standalone Windows app
        shell: pwsh
        run: |
          npm run dist:win:portable 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content windows-build.log -Tail 30 | ForEach-Object { Write-Output "::error::$_" }
            exit $buildExit
          }
      - name: Verify the packaged Bluetooth service and compact window
        shell: pwsh
        run: |
          node scripts/check-packaged.cjs 2>&1 | Tee-Object -FilePath packaged-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Get-Content packaged-test.log -Tail 30 | ForEach-Object { Write-Output "::error::$_" }
            exit $testExit
          }
      - uses: actions/upload-artifact@v5
        with:
          name: Airpod-Connect-Windows
          path: release/*Portable.exe
          if-no-files-found: error
